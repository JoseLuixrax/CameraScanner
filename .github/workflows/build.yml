name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Botón "Run workflow" en la pestaña Actions. Si se indica una versión,
  # GitHub crea el tag vX.Y.Z y publica la Release con el APK.
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión a publicar como Release (p. ej. 1.0.0). Vacío = solo compilar.'
        required: false
        default: ''

permissions:
  contents: write # para crear tags y releases con el APK

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Los secrets no se pueden usar directamente en `if:`.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Firma opcional con tu propia clave (ver README → "Firmar el APK").
      # Sin estos secrets se firma con una clave de depuración temporal.
      - name: Configurar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Versión: en un tag vX.Y.Z se usa X.Y.Z; si no, la de pubspec.yaml.
      # El número de build (versionCode) es el nº de ejecución de CI: siempre
      # crece, así Android permite instalar cada versión encima de la anterior
      # (si se firma con la misma clave, ver README → "Firmar el APK").
      - name: Calcular versión
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            RELEASE=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            NAME="${INPUT_VERSION#v}"
            RELEASE=true
          else
            NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          if [[ "$RELEASE" == true && ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión '$NAME' no tiene el formato X.Y.Z (p. ej. 1.0.0)"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Versión $NAME (build ${{ github.run_number }}), release=$RELEASE"

      - name: Compilar APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "escaner-pdf-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: escaner-pdf-apk
          path: escaner-pdf-*.apk
          retention-days: 30

      - name: Publicar release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Escáner PDF ${{ steps.version.outputs.name }}
          files: escaner-pdf-*.apk
          make_latest: true
          generate_release_notes: true
          body: |
            ## Instalación (Android)

            1. Descarga **escaner-pdf-${{ steps.version.outputs.name }}.apk** (abajo, en *Assets*).
            2. Ábrelo en el móvil y permite "instalar apps desconocidas" si lo pide.
            3. Si tenías una versión firmada con otra clave, desinstálala antes.

            Funciona sin conexión: detección de bordes, mejora de imagen y OCR
            se hacen en el propio móvil.
